<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema de Asignación Académica</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div id="login" class="login-screen">
  <div class="login-card">
    <div class="brand-mark">SA</div>
    <h1>Asignación Académica</h1>
    <p>Gestión de cursos, horarios y salones</p>
    <label>Usuario</label><input id="loginUser" value="admin" autocomplete="username">
    <label>Contraseña</label><input id="loginPass" type="password" value="admin123" autocomplete="current-password">
    <button class="primary full" id="loginBtn">Ingresar</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark small">SA</div><div><b>Asignación</b><span>Académica</span></div></div>
    <nav id="nav">
      <button data-view="inicio" class="nav active">Inicio</button>
      <button data-view="cursos" class="nav">Cursos</button>
      <button data-view="asignaciones" class="nav">Asignaciones</button>
      <button data-view="horario" class="nav">Horario</button>
      <button data-view="salones" class="nav">Salones</button>
      <button data-view="importar" class="nav">Importar plantilla</button>
      <button data-view="reportes" class="nav">Reportes</button>
      <button data-view="respaldo" class="nav">Respaldo</button>
    </nav>
    <div class="account"><b>admin</b><button id="logoutBtn">Cerrar sesión</button></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h2 id="viewTitle">Inicio</h2><span id="periodLabel"></span></div>
      <div class="top-actions"><button id="newBtn" class="primary">+ Nueva asignación</button></div>
    </header>
    <section id="content"></section>
  </main>
</div>

<div id="modalRoot"></div>
<script src="js/app.js"></script>
</body>
</html>
